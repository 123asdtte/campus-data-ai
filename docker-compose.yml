# =====================================================================
# 校园数据管理与 AI 助手平台 — 阶段 1 运行栈
# 仅包含：PostgreSQL（业务主库） + Import API（导入校验）
# 第一阶段不部署 Dify；Dify 在阶段 2 按需追加，避免磁盘与内存过早占用。
# 2026-10-22：Appsmith 服务已按路线图 R2 下线（前端主入口为 campus-web），
# 数据卷 campus_appsmith_stacks 保留，需要时可将服务定义原样加回。
#
# 使用：
#   cp .env.example .env      # 填写密码
#   docker compose up -d
# 注意：所有端口只绑定 127.0.0.1，不暴露到局域网/公网。
# =====================================================================
name: campus-data-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  campus-db:
    image: postgres:16.15-alpine
    container_name: campus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus}
      POSTGRES_USER: ${POSTGRES_USER:-campus_dba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请检查 .env}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - campus_pgdata:/var/lib/postgresql/data
      # 仅在数据卷为空时执行一次：建表 + 演示数据
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_seed_demo.sql:/docker-entrypoint-initdb.d/002_seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - campus-net

  import-api:
    build:
      context: ./import-api
    image: campus-import-api:0.1.0
    container_name: campus-import-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://campus_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD 未设置}@campus-db:5432/${POSTGRES_DB:-campus}
      ACTOR_FALLBACK: import-api
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_ROWS: ${MAX_ROWS:-10000}
      KEEP_UPLOAD_FILES: ${KEEP_UPLOAD_FILES:-false}
      # 内部认证默认关闭；开启后所有业务路由要求 X-Internal-* 签名
      INTERNAL_AUTH_ENABLED: ${INTERNAL_AUTH_ENABLED:-false}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:-}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - campus_uploads:/data/uploads
      - ./samples:/app/samples
    depends_on:
      campus-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - campus-net

volumes:
  campus_pgdata:
    name: campus_pgdata
  # Appsmith 已下线（R2），此声明仅用于保留既有数据卷 campus_appsmith_stacks，
  # 避免误删；恢复服务时直接复用同名卷即可。
  appsmith_stacks:
    name: campus_appsmith_stacks
  campus_uploads:
    name: campus_uploads

networks:
  campus-net:
    name: campus-net
    driver: bridge
