# =====================================================================
# 校园数据管理与 AI 助手平台 — 阶段 1 运行栈
# 仅包含：PostgreSQL（业务主库） + Import API（导入校验）
# 第一阶段不部署 Dify；Dify 在阶段 2 按需追加，避免磁盘与内存过早占用。
# 2026-10-22：Appsmith 服务已按路线图 R2 下线（前端主入口为 campus-web），
# 数据卷 campus_appsmith_stacks 保留，需要时可将服务定义原样加回。
#
# 使用：
#   cp .env.example .env      # 填写密码
#   docker compose up -d
# 注意：所有端口只绑定 127.0.0.1，不暴露到局域网/公网。
# =====================================================================
name: campus-data-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  campus-db:
    image: postgres:16.15-alpine
    container_name: campus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus}
      POSTGRES_USER: ${POSTGRES_USER:-campus_dba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请检查 .env}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - campus_pgdata:/var/lib/postgresql/data
      # 仅在数据卷为空时执行一次：建表 + 演示数据
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_seed_demo.sql:/docker-entrypoint-initdb.d/002_seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - campus-net

  import-api:
    build:
      context: ./import-api
    image: campus-import-api:0.1.0
    container_name: campus-import-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://campus_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD 未设置}@campus-db:5432/${POSTGRES_DB:-campus}
      ACTOR_FALLBACK: import-api
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_ROWS: ${MAX_ROWS:-10000}
      KEEP_UPLOAD_FILES: ${KEEP_UPLOAD_FILES:-false}
      # 内部认证默认关闭；开启后所有业务路由要求 X-Internal-* 签名
      INTERNAL_AUTH_ENABLED: ${INTERNAL_AUTH_ENABLED:-false}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:-}
      TZ: Asia/Shanghai
    # PR-D：移除 127.0.0.1:8010 宿主发布。业务请求统一经网关（campus-web/gateway → import-api:8000 内网）；
    # 宿主不再存在可绕过网关直连 import-api 的端口。
    volumes:
      - campus_uploads:/data/uploads
      - ./samples:/app/samples
    depends_on:
      campus-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - campus-net

  # -------------------------------------------------------------------
  # PR-B：RuoYi 网关最小切片
  # 认证库与业务库物理隔离：网关账号只碰 campus_gateway，不碰 campus schema。
  # -------------------------------------------------------------------
  gateway-db:
    image: postgres:16.15-alpine
    container_name: campus-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GATEWAY_DB_NAME:-campus_gateway}
      POSTGRES_USER: ${GATEWAY_DB_USER:-gateway_dba}
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?GATEWAY_DB_PASSWORD 未设置}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - gateway_pgdata:/var/lib/postgresql/data
      # 仅首次初始化执行：RuoYi sys_* 表 + 学院/权限夹具
      - ./sql/005_gateway_bootstrap.sql:/docker-entrypoint-initdb.d/005_gateway_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - campus-net

  gateway-redis:
    image: redis:7.4-alpine
    container_name: campus-gateway-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${GATEWAY_REDIS_PASSWORD:?GATEWAY_REDIS_PASSWORD 未设置}"]
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - gateway_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${GATEWAY_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      GATEWAY_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:?GATEWAY_REDIS_PASSWORD 未设置}
    logging: *default-logging
    networks:
      - campus-net

  gateway:
    build:
      context: ./gateway
    image: campus-gateway:0.1.0
    container_name: campus-gateway
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      GATEWAY_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?INTERNAL_HMAC_SECRET 未设置}
      # Sa-Token JWT 签名密钥：缺失即启动/登录失败（fail-closed），不得写死在镜像里
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 未设置}
    # 启动参数优先级最高：直接指向容器内服务名，避免 profile 配置差异
    command:
      - "--spring.datasource.dynamic.datasource.master.driverClassName=org.postgresql.Driver"
      - "--spring.datasource.dynamic.datasource.master.url=jdbc:postgresql://gateway-db:5432/${GATEWAY_DB_NAME:-campus_gateway}"
      - "--spring.datasource.dynamic.datasource.master.username=${GATEWAY_DB_USER:-gateway_dba}"
      - "--spring.datasource.dynamic.datasource.master.password=${GATEWAY_DB_PASSWORD}"
      - "--spring.data.redis.host=gateway-redis"
      - "--spring.data.redis.port=6379"
      - "--spring.data.redis.password=${GATEWAY_REDIS_PASSWORD}"
      - "--internal.hmac-secret=${INTERNAL_HMAC_SECRET}"
      - "--internal.importapi-base=http://import-api:8000"
      - "--captcha.enable=false"
      # 仅开发/测试环境：生产必须开启传输加密并替换为受控方案
      - "--api-decrypt.enabled=false"
    ports:
      - "127.0.0.1:9190:9180"
    healthcheck:
      # 轻量存活探针：仅验证进程可响应 HTTP，不依赖 Actuator Basic Auth
      test: ["CMD-SHELL", "curl -fsS http://localhost:9180/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      gateway-db:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - campus-net

volumes:
  campus_pgdata:
    name: campus_pgdata
  # Appsmith 已下线（R2），此声明仅用于保留既有数据卷 campus_appsmith_stacks，
  # 避免误删；恢复服务时直接复用同名卷即可。
  appsmith_stacks:
    name: campus_appsmith_stacks
  campus_uploads:
    name: campus_uploads
  gateway_pgdata:
    name: campus_gateway_pgdata
  gateway_redis:
    name: campus_gateway_redis

networks:
  campus-net:
    name: campus-net
    driver: bridge
