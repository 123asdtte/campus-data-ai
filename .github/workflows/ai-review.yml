name: AI 评审

# PR 创建/更新时自动执行。评审结论以评论形式发布，仅供参考，不阻塞合并。
# 需要先在仓库 Secrets 配置：AI_API_KEY / AI_BASE_URL / AI_MODEL，未配置时自动跳过。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI 评审
    runs-on: ubuntu-latest
    # 必须大于脚本本身的最坏耗时（curl 重试上限 600s + checkout/gh 约 90s），
    # 否则 job 会在「发布失败说明」之前被 kill，留痕逻辑等于没生效。
    timeout-minutes: 15
    # 同一 PR 连续推送时取消上一轮评审，避免排队堆积和重复评论。
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: 检出完整历史（diff 需要）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 执行 AI 评审
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 可选：仓库 Variables（不是 Secrets）里配置，用来关掉推理模型的思考阶段，
          # 或调整超时/重试，无需改脚本。留空则用脚本内默认值。
          AI_EXTRA_BODY: ${{ vars.AI_EXTRA_BODY }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
          LLM_RETRY: ${{ vars.LLM_RETRY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # pull_request 事件里 GITHUB_SHA 是「合并预演」提交（refs/pull/N/merge），
          # 不是 PR 的实际提交；评论里要引用提交号必须用 head sha。
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ai-review.sh
