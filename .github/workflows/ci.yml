name: CI

on:
  push:
    branches: [main]
  # 堆叠 PR 的 base 可能是阶段分支而非 main，因此不限制 base 分支
  pull_request:

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: 后端语法与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q import-api/app import-api/scripts

  gateway:
    name: 网关构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # 真实 application-dev.yml 已被 .gitignore 排除；构建只依赖源码与 application.yml
      - run: mvn -B -DskipTests -pl ruoyi-admin -am package

  backend-tests:
    name: 后端接口与校验测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: campus_test
          POSTGRES_PASSWORD: campus_test
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_test -d campus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 管理连接：只用于初始化与清理（campus_test 是 superuser）
      CAMPUS_TEST_ADMIN_DATABASE_URL: postgresql://campus_test:campus_test@127.0.0.1:5432/campus_test
      # 业务连接：必须以 campus_app 身份跑测试，才能验证 003/004 的授权
      CAMPUS_TEST_DATABASE_URL: postgresql://campus_app:campus_test_app_pw@127.0.0.1:5432/campus_test
      CAMPUS_TEST_APP_PASSWORD: campus_test_app_pw
      INTERNAL_HMAC_SECRET: campus-test-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: import-api/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r import-api/requirements-dev.txt
      - name: 初始化测试库（001 → 003 → 004 → 006，含权限校验）
        # 002 是演示数据且会宽范围删除审计记录，默认不执行
        run: python scripts/init-test-db.py --verify
      - name: pytest（认证关闭，兼容旧行为）
        working-directory: import-api
        run: python -m pytest
      - name: pytest（认证开启，安全用例）
        working-directory: import-api
        env:
          INTERNAL_AUTH_ENABLED: 'true'
        run: python -m pytest tests/test_internal_auth.py tests/test_route_matrix.py tests/test_db_privileges.py tests/test_import_scope.py tests/test_student_write.py tests/test_pr_e_hardening.py tests/test_import_audit_summary.py

  ai-assistant-tests:
    name: AI 助手原型测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ai_dba
          POSTGRES_PASSWORD: ai_dba_pw
          POSTGRES_DB: campus_ai_poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_dba -d campus_ai_poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_DB_PASSWORD: ai_dba_pw
      AI_RO_PASSWORD: ai_ro_pw
      AI_AUDIT_PASSWORD: ai_audit_pw
      AI_POC_TOKEN: ci-poc-token
      # services.postgres 映射到 5432（本地 compose 默认 55435）
      AI_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: import-api/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r import-api/requirements-dev.txt
      - name: 初始化 AI POC 库（虚构数据 + 最小权限角色）
        run: |
          psql "postgresql://ai_dba:ai_dba_pw@127.0.0.1:5432/campus_ai_poc" \
            -v ON_ERROR_STOP=1 \
            -v ai_ro_password=ai_ro_pw \
            -v ai_audit_password=ai_audit_pw \
            -f ai-assistant/sql/001_schema.sql
      - name: pytest（权限、脱敏、审计、注入、LLM 白名单）
        working-directory: ai-assistant
        run: python -m pytest
