name: CI

on:
  push:
    branches: [main]
  # 堆叠 PR 的 base 可能是阶段分支而非 main，因此不限制 base 分支
  pull_request:

jobs:
  demo-tests:
    name: 本地演示 API 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 语法检查
        run: python -m compileall -q demo-api/app.py demo-api/tests
      - name: unittest（身份范围、校验、台账、并发、数据一致性）
        run: python -m unittest discover -s demo-api/tests -p 'test_*.py' -v

  demo-e2e:
    name: 演示栈 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: 构建网关 jar（镜像运行前置）
        working-directory: gateway
        run: mvn -B -DskipTests -pl ruoyi-admin -am package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        working-directory: web
        run: npm ci
      - name: 生成 CI 专用环境变量
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-demo-placeholder
          APP_DB_PASSWORD=ci-demo-placeholder
          RO_DB_PASSWORD=ci-demo-placeholder
          GATEWAY_DB_PASSWORD=ci-demo-placeholder
          GATEWAY_REDIS_PASSWORD=ci-demo-placeholder
          INTERNAL_HMAC_SECRET=ci-demo-hmac-secret-0123456789abcdef
          JWT_SECRET_KEY=ci-demo-jwt-secret-0123456789abcdef
          # 与生产一致的内部签名链路：网关签名、导入服务验签、nonce 落库
          INTERNAL_AUTH_ENABLED=true
          EOF
      - name: 启动数据库
        run: docker compose up -d gateway-db gateway-redis campus-db
      - name: 等待数据库健康
        run: |
          set -e
          wait_healthy() {
            for i in $(seq 1 80); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$1" 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then
                echo "$1 healthy after ${i} checks"
                return 0
              fi
              sleep 3
            done
            echo "::error::$1 240 秒内未就绪（最后状态：$status）"
            return 1
          }
          wait_healthy campus-gateway-db
          wait_healthy campus-db
      - name: 初始化演示库角色与内部认证（003/004/006）
        run: |
          set -e
          for file in sql/003_roles.sql sql/004_internal_auth.sql sql/006_import_scope.sql; do
            echo "applying $file"
            docker compose exec -T campus-db psql -U campus_dba -d campus \
              -v ON_ERROR_STOP=1 \
              -v app_password=ci-demo-placeholder \
              -v ro_password=ci-demo-placeholder < "$file"
          done
      - name: 启动网关与导入服务
        run: docker compose up -d import-api gateway
      - name: 等待网关与导入服务就绪
        run: |
          set -e
          wait_healthy() {
            for i in $(seq 1 80); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$1" 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then
                echo "$1 healthy after ${i} checks"
                return 0
              fi
              sleep 3
            done
            echo "::error::$1 240 秒内未就绪（最后状态：$status）"
            return 1
          }
          wait_healthy campus-import-api
          wait_healthy campus-gateway
      - name: 写入演示账号
        run: |
          docker compose exec -T gateway-db psql -U gateway_dba -d campus_gateway \
            -v ON_ERROR_STOP=1 < scripts/demo/seed-demo-accounts.sql
      - name: 启动演示栈
        run: |
          docker compose -p campus-demo \
            -f docker-compose.demo.yml -f docker-compose.demo.e2e.yml up -d --build
      - name: 等待演示站就绪
        run: |
          set -e
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/login)" = "200" ]; then
              echo "demo web ready after ${i} checks"
              exit 0
            fi
            sleep 3
          done
          echo "::error::演示站 180 秒内未就绪"
          docker compose -p campus-demo \
            -f docker-compose.demo.yml -f docker-compose.demo.e2e.yml logs
          exit 1
      - name: 安装 Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E（16 条，含悬浮 AI 与移动端）
        working-directory: web
        env:
          PW_CHANNEL: chromium
          DEMO_BASE_URL: http://127.0.0.1:8083
        run: npx playwright test
      - name: 失败时导出演示栈日志
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -p campus-demo \
            -f docker-compose.demo.yml -f docker-compose.demo.e2e.yml logs --no-color > artifacts/demo-stack.log || true
          docker compose logs --no-color gateway gateway-db gateway-redis campus-db import-api > artifacts/gateway-stack.log || true
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-e2e-failure
          path: |
            web/test-results
            artifacts
          retention-days: 7
      - name: 清理
        if: always()
        run: |
          docker compose -p campus-demo \
            -f docker-compose.demo.yml -f docker-compose.demo.e2e.yml down -v || true
          docker compose down -v || true

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: 后端语法与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q import-api/app import-api/scripts

  gateway:
    name: 网关构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # 真实 application-dev.yml 已被 .gitignore 排除；构建只依赖源码与 application.yml
      - run: mvn -B -DskipTests -pl ruoyi-admin -am package
      # 日志脱敏回归：校验敏感字段名单，以及嵌套对象/数组的递归清理行为。
      # 父 POM 默认 maven.test.skip=true，这里只对目标模块显式开启并限定测试类。
      - run: mvn -B -pl ruoyi-common/ruoyi-common-web -am -Dmaven.test.skip=false -Dprofiles.active=dev -Dtest=LogRedactionTest -Dsurefire.failIfNoSpecifiedTests=false test
      # 生产构建配置卫生：-Pprod 必须配合 clean，否则 target/classes 中残留的
      # application-dev.yml / application-prod.yml 会被打进 jar（D-005）。
      - name: 生产构建配置卫生
        run: |
          set -e
          mvn -B -Pprod clean package -DskipTests -pl ruoyi-admin -am
          if unzip -l ruoyi-admin/target/ruoyi-admin.jar | grep -E 'BOOT-INF/classes/application-(dev|prod)\.yml'; then
            echo "::error::prod jar 包含 application-dev.yml 或 application-prod.yml"
            exit 1
          fi
          unzip -l ruoyi-admin/target/ruoyi-admin.jar | grep -q 'BOOT-INF/classes/application.yml'
          echo "prod jar 仅包含 application.yml"

  backend-tests:
    name: 后端接口与校验测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: campus_test
          POSTGRES_PASSWORD: campus_test
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_test -d campus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 管理连接：只用于初始化与清理（campus_test 是 superuser）
      CAMPUS_TEST_ADMIN_DATABASE_URL: postgresql://campus_test:campus_test@127.0.0.1:5432/campus_test
      # 业务连接：必须以 campus_app 身份跑测试，才能验证 003/004 的授权
      CAMPUS_TEST_DATABASE_URL: postgresql://campus_app:campus_test_app_pw@127.0.0.1:5432/campus_test
      CAMPUS_TEST_APP_PASSWORD: campus_test_app_pw
      INTERNAL_HMAC_SECRET: campus-test-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: import-api/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r import-api/requirements-dev.txt
      - name: 初始化测试库（001 → 003 → 004 → 006，含权限校验）
        # 002 是演示数据且会宽范围删除审计记录，默认不执行
        run: python scripts/init-test-db.py --verify
      - name: pytest（认证关闭，兼容旧行为）
        working-directory: import-api
        run: python -m pytest
      - name: pytest（认证开启，安全用例）
        working-directory: import-api
        env:
          INTERNAL_AUTH_ENABLED: 'true'
        run: python -m pytest tests/test_internal_auth.py tests/test_route_matrix.py tests/test_db_privileges.py tests/test_import_scope.py tests/test_student_write.py tests/test_pr_e_hardening.py tests/test_import_audit_summary.py

  compose-config:
    name: Compose 组合校验
    runs-on: ubuntu-latest
    env:
      # config 只做插值与语法校验，使用一次性占位值即可
      POSTGRES_PASSWORD: ci-placeholder
      APP_DB_PASSWORD: ci-placeholder
      RO_DB_PASSWORD: ci-placeholder
      GATEWAY_DB_PASSWORD: ci-placeholder
      GATEWAY_REDIS_PASSWORD: ci-placeholder
      INTERNAL_HMAC_SECRET: ci-placeholder-hmac-secret-0123456789
      JWT_SECRET_KEY: ci-placeholder-jwt-secret-0123456789abcdef
      AI_DB_PASSWORD: ci-placeholder
      AI_RO_PASSWORD: ci-placeholder
      AI_AUDIT_PASSWORD: ci-placeholder
      AI_POC_TOKEN: ci-placeholder-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 渲染并校验 Alertmanager 配置
        run: |
          set -e
          python -m pip install --quiet pyyaml
          python scripts/render-alertmanager-config.py
          python -c "import yaml; yaml.safe_load(open('runtime-config/alertmanager.yml', encoding='utf-8')); print('null receiver yaml ok')"
          ALERT_WEBHOOK_URL=https://example.invalid/alerts python scripts/render-alertmanager-config.py
          python -c "import yaml; yaml.safe_load(open('runtime-config/alertmanager.yml', encoding='utf-8')); print('webhook receiver yaml ok')"
      - name: 校验主栈与各覆盖文件
        run: |
          set -e
          docker compose config -q
          docker compose -f docker-compose.web.yml config -q
          docker compose -p campus-demo -f docker-compose.demo.yml -f docker-compose.demo.e2e.yml config -q
          docker compose -f docker-compose.web.yml -f docker-compose.tls.yml config -q
          docker compose -f docker-compose.ai-poc.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose --profile monitoring -f docker-compose.yml -f docker-compose.monitoring-webhook.yml config -q

  ai-assistant-tests:
    name: AI 助手原型测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ai_dba
          POSTGRES_PASSWORD: ai_dba_pw
          POSTGRES_DB: campus_ai_poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_dba -d campus_ai_poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_DB_PASSWORD: ai_dba_pw
      AI_RO_PASSWORD: ai_ro_pw
      AI_AUDIT_PASSWORD: ai_audit_pw
      AI_POC_TOKEN: ci-poc-token
      # services.postgres 映射到 5432（本地 compose 默认 55435）
      AI_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: import-api/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r import-api/requirements-dev.txt
      - name: 初始化 AI POC 库（虚构数据 + 最小权限角色）
        run: |
          psql "postgresql://ai_dba:ai_dba_pw@127.0.0.1:5432/campus_ai_poc" \
            -v ON_ERROR_STOP=1 \
            -v ai_ro_password=ai_ro_pw \
            -v ai_audit_password=ai_audit_pw \
            -f ai-assistant/sql/001_schema.sql
      - name: pytest（权限、脱敏、审计、注入、LLM 白名单）
        working-directory: ai-assistant
        run: python -m pytest
