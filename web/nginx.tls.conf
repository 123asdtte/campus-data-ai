# TLS 入口模板（仅开发/隔离环境验证使用）
#
# 生产启用前必须完成（属 C 类人工授权）：
#   1. 由受控渠道签发/续期证书，替换 certs/ 下的自签名文件；
#   2. 决定 TLS 终止位置（本 nginx 或前置负载均衡），并同步更新本文档；
#   3. 配置 80 → 443 跳转、HSTS 与证书到期告警；
#   4. 验证后再切换正式流量。
#
# 开发验证：
#   ./scripts/gen-dev-cert.sh
#   docker compose -p campus-web -f docker-compose.web.yml -f docker-compose.tls.yml up -d --build
#   curl -k https://127.0.0.1:8443/healthz
server {
    listen       443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    # 仅允许现代协议；若需兼容旧客户端，先在预发验证再放宽
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    # 限制慢速/半开客户端长期占用连接
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 基础安全响应头 + HSTS（仅 TLS 入口）
    include /etc/nginx/snippets/campus-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 与 80 入口相同：动态解析网关，避免网关重建后 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream gateway:9180;
    set $demo_api_upstream demo-api:8000;

    include /etc/nginx/snippets/campus-common.conf;
}
