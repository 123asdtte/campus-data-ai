# 按来源 IP 限制网关/演示 API 的请求速率与并发，防止脚本刷数据或登录洪水。
# 静态资源不经过这两个 location，不受影响。
limit_req_zone  $binary_remote_addr zone=api_req:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    # 限流命中时返回 429，而不是默认 503
    limit_req_status  429;
    limit_conn_status 429;

    # 限制慢速/半开客户端长期占用连接
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # 文本类资源压缩；员工数据 JSON 约 3.9MB，未压缩会明显拖慢首屏
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 基础安全响应头；server 级覆盖没有自带 add_header 的 location
    include /etc/nginx/snippets/campus-security-headers.conf;

    # 动态解析 Docker 服务名。
    # 背景：nginx 内置的 upstream 解析只在启动时做一次，之后把 IP 缓存住。
    # 网关容器一旦重建（例如换镜像、改 compose），IP 会变，而 campus-web
    # 仍指向旧 IP，表现为 /gw/* 全部 502（实测：网关 healthy，8082 反代 502）。
    # 用变量 + resolver 让 nginx 按 valid 周期重新解析，避免“必须重启前端”。
    # 127.0.0.11 是 Docker 内置 DNS；ipv6=off 避免解析到不可用的 v6 地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream gateway:9180;
    set $demo_api_upstream demo-api:8000;

    # 业务 location 统一放在公共片段，HTTP/HTTPS 共用
    include /etc/nginx/snippets/campus-common.conf;
}
