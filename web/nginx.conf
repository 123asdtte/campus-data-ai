server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 动态解析 Docker 服务名。
    # 背景：nginx 内置的 upstream 解析只在启动时做一次，之后把 IP 缓存住。
    # 网关容器一旦重建（例如换镜像、改 compose），IP 会变，而 campus-web
    # 仍指向旧 IP，表现为 /gw/* 全部 502（实测：网关 healthy，8082 反代 502）。
    # 用变量 + resolver 让 nginx 按 valid 周期重新解析，避免“必须重启前端”。
    # 127.0.0.11 是 Docker 内置 DNS；ipv6=off 避免解析到不可用的 v6 地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream gateway:9180;

    # 业务 location 统一放在公共片段，HTTP/HTTPS 共用
    include /etc/nginx/snippets/campus-common.conf;
}
