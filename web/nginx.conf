server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 动态解析 Docker 服务名。
    # 背景：nginx 内置的 upstream 解析只在启动时做一次，之后把 IP 缓存住。
    # 网关容器一旦重建（例如换镜像、改 compose），IP 会变，而 campus-web
    # 仍指向旧 IP，表现为 /gw/* 全部 502（实测：网关 healthy，8082 反代 502）。
    # 用变量 + resolver 让 nginx 按 valid 周期重新解析，避免“必须重启前端”。
    # 127.0.0.11 是 Docker 内置 DNS；ipv6=off 避免解析到不可用的 v6 地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream gateway:9180;

    # 健康检查：供容器 healthcheck 与人工探活使用
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # PR-D：旧的 `/api/` 直连 FastAPI 入口已移除。
    # 浏览器只能通过 `/gw/` 携带登录 token 访问业务接口；
    # import-api 仅在容器网络内由网关调用，不再对前端暴露。

    # PR-B：Java 网关（登录 + 学生/导入/聚合代理）
    # /gw/auth/login      -> /auth/login
    # /gw/internal/proxy/* -> /internal/proxy/*
    location /gw/ {
        # 用变量代理时必须先显式剥掉 /gw 前缀，再交给 proxy_pass；
        # 否则变量形式不会像字面量 URL 那样自动替换 location 匹配部分。
        rewrite ^/gw/(.*)$ /$1 break;
        proxy_pass         http://$gateway_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 10MB 文件经 base64 编码后约 13.4MB，网关入口必须放行
        client_max_body_size  20m;
    }

    # 带哈希的静态资源可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/students、/import 等刷新后仍返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
