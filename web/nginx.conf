server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 健康检查：供容器 healthcheck 与人工探活使用
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 业务接口反向代理
    # 关键点：
    #   1) proxy_pass 末尾带斜杠，会把 /api/students 改写成 /students
    #   2) 目标写服务名 import-api，容器内 localhost 指向自身，不能用 localhost
    #   3) 前端上传走 base64 JSON，10 MB 文件编码后约 13.4 MB，故放宽到 20m
    location /api/ {
        proxy_pass         http://import-api:8000/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Actor           $http_x_actor;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        client_max_body_size  20m;
    }

    # PR-B：Java 网关（登录 + 学生域代理）
    # /gw/auth/login      -> /auth/login
    # /gw/internal/proxy/* -> /internal/proxy/*
    location /gw/ {
        proxy_pass         http://gateway:9180/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 带哈希的静态资源可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/students、/import 等刷新后仍返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
